# Usa H2 em memória para iniciar o contexto de teste sem um PostgreSQL externo.
spring.datasource.url=jdbc:h2:mem:school_project_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Segredo de teste usado somente para permitir a inicialização dos componentes JWT.
jwt.secret=school-project-test-secret-key-for-context-startup
jwt.expiration=86400000
